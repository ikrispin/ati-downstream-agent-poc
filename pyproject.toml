[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ati-lscore-poc"
version = "0.2.0"
description = "ATI domain MCP tools and headless client for the native LSCore agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx==0.28.1",
  "mcp==1.30.0",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
ati-lscore = "ati_lscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ati_lscore = ["templates/*.yaml", "templates/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
